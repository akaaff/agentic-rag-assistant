# Calibrated from one real run against the full golden set (qwen2.5:7b-
# instruct as judge, see DECISIONS.md) - not picked in the abstract.
# Observed averages: answer_relevancy 0.862, faithfulness 0.900,
# context_precision 0.550, context_recall 0.792. Per-case scores varied a
# lot even within that single run (context_precision ranged 0.25-0.917
# across just 5 non-guardrail cases), so thresholds are set with real
# margin below the observed averages - tight enough to catch a genuine
# regression, loose enough to survive normal LLM-judge noise run to run.
# These are based on a single calibration run; revisit if repeated runs
# show the noise band is wider or narrower than assumed here.
faithfulness: 0.65
answer_relevancy: 0.65
context_precision: 0.35
context_recall: 0.55
