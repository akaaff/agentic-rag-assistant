[project]
name = "agentic-rag-assistant"
version = "0.1.0"
description = "Agentic RAG research/support assistant: LangGraph agent loop, hybrid retrieval over pgvector, RAGAS eval, read-only integration with order-fulfillment-platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "numpy>=2.5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose, not code - wrapping it to 100 cols makes it harder
# to read/edit for no real benefit (unlike code, where line length affects
# how easily you can follow control flow).
"app/agent/prompts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live order-fulfillment-platform gateway (skipped by default)",
    "llm: requires a live Ollama instance, no gateway needed (skipped by default)",
]
addopts = "-m 'not integration and not llm'"

[tool.uv]
package = false
