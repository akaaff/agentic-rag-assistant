[project]
name = "agentic-rag-assistant"
version = "0.1.0"
description = "Agentic RAG research/support assistant: LangGraph agent loop, hybrid retrieval over pgvector, RAGAS eval, read-only integration with order-fulfillment-platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live order-fulfillment-platform gateway (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.uv]
package = false
